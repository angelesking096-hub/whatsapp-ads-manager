databases:
  # Base de données PostgreSQL managée gratuite sur Render
  - name: whatsapp-ads-db
    databaseName: whatsapp_ads_manager
    user: whatsapp_admin
    plan: free
    region: frankfurt

services:
  # Service Web principal (Laravel 12 + Apache + PHP 8.2)
  - type: web
    name: whatsapp-ads-manager
    runtime: docker
    plan: free
    region: frankfurt
    healthCheckPath: /up
    envVars:
      - key: APP_NAME
        value: "WhatsApp Ads Manager"
      - key: APP_ENV
        value: production
      - key: APP_DEBUG
        value: "false"
      - key: APP_URL
        sync: false
      - key: APP_TIMEZONE
        value: Africa/Douala
      - key: APP_LOCALE
        value: fr
      - key: APP_KEY
        value: "base64:stTrRM74kvLHx2DUWFfEFh/uG79z8YxUAVan0DgsSKA="
      - key: LOG_CHANNEL
        value: stderr
      - key: SESSION_DRIVER
        value: database
      - key: CACHE_STORE
        value: database
      - key: QUEUE_CONNECTION
        value: database
      - key: FILESYSTEM_DISK
        value: public
      # Connexion automatique à la base de données PostgreSQL Render
      - key: DB_CONNECTION
        value: pgsql
      - key: DATABASE_URL
        fromDatabase:
          name: whatsapp-ads-db
          property: connectionString
